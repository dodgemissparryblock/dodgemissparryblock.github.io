<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMK Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-container" style="display: none;">
        <div class="nav-container">
            <nav class="navbar">
                <div></div>
                <button id="themeToggle" class="btn" onclick="toggleDarkMode()">🌙</button>
            </nav>
        </div>

        <div class="content">
            <div class="hero">
                <div class="f-word">Fuck</div> / 
                <div class="m-word">Marry</div> / 
                <div class="k-word">KILL</div>
            </div>

            <div id="login-container" class="login-container" style="width: 100%;">
                    <div class="form-group">
                        <label for="displayName">Display Name</label>
                        <input type="text" id="displayName" name="displayName" class="form-control" placeholder="Enter your name" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="serverPassword">Server Password</label>
                        <input type="password" id="serverPassword" name="serverPassword" class="form-control" placeholder="Enter server password" required>
                    </div>

                    <button class="start-btn" onclick="doLogin()">START</button>
            </div>
        </div>
    </div>
    <div id="game-container" style="display:none;">
        <div class="nav-container">
            <nav class="navbar">
                <div class="hero-lite">
                    <div class="f-word">Fuck</div> / 
                    <div class="m-word">Marry</div> / 
                    <div class="k-word">KILL</div>
                </div>
                <button id="themeToggle" class="btn" onclick="toggleDarkMode()">🌙</button>
            </nav>
        </div>
        <div class="content">
            <h1 id="roundTitle">Loading...</h1>

            <!-- Dynamically rendered character cards -->
            <div class="game-grid" id="gameGrid"></div>

            <h3 id="resultsTitle">Tip: you can pause the game by shutting down your device and going to bed</h3>

            <!-- Dynamically rendered results table -->

            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr id="tableHeader"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <script src="scripts.js"></script>

            <div id="nxt-btn" class="table-container" style="display:none;">
                <button onclick="lockIn(true)" class="nxt-btn">Next Round ➡️</button>
            </div>
        </div>
    </div>
</body>
</html>
